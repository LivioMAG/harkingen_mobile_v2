<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="app-build-version" content="2026-06-23-1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="service.css?v=2026-06-23-1" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="service.js?v=2026-06-23-1"></script>
  </head>
  <body>
    <main class="service-shell">
      <a class="back-link" href="./index.html" aria-label="Zurück zur Zeiterfassung">
        <span data-lucide="arrow-left" aria-hidden="true"></span>
        <span>Zeiterfassung</span>
      </a>

      <section class="service-card" aria-labelledby="serviceTitle">
        <div class="service-heading">
          <span class="service-icon" data-lucide="table-2" aria-hidden="true"></span>
          <div>
            <p class="section-label">Service</p>
            <h1 id="serviceTitle">Rapport-Matrix</h1>
            <p class="service-description">Übersicht der normalen Rapporte pro Projekt, Kommissionsnummer und Wochentag.</p>
          </div>
        </div>

        <div class="matrix-toolbar" aria-label="Wochenauswahl">
          <button class="week-btn" id="prevWeekBtn" type="button">
            <span data-lucide="chevron-left" aria-hidden="true"></span>
            <span>Vorherige</span>
          </button>
          <div class="week-summary">
            <span id="weekLabel">KW wird geladen …</span>
            <small id="serviceStatus" data-type="neutral">Rapporte werden geladen …</small>
          </div>
          <button class="week-btn" id="nextWeekBtn" type="button">
            <span>Nächste</span>
            <span data-lucide="chevron-right" aria-hidden="true"></span>
          </button>
          <button class="week-btn week-btn-secondary" id="currentWeekBtn" type="button">Aktuelle Woche</button>
        </div>

        <div class="matrix-wrap" role="region" aria-label="Rapport-Matrix" tabindex="0">
          <table class="report-matrix">
            <thead>
              <tr>
                <th scope="col">Projektname</th>
                <th scope="col">Kommissionsnummer</th>
                <th scope="col">MO</th>
                <th scope="col">DI</th>
                <th scope="col">MI</th>
                <th scope="col">DO</th>
                <th scope="col">FR</th>
                <th scope="col">SA</th>
                <th scope="col">SO</th>
                <th scope="col">Total</th>
              </tr>
            </thead>
            <tbody id="reportTableBody"></tbody>
          </table>
          <p class="empty-state" id="reportEmpty" hidden>Für diese Woche sind keine normalen Rapporte vorhanden.</p>
        </div>
      </section>
    </main>
  </body>
</html>
