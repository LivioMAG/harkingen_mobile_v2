<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="service.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="service.js"></script>
  </head>
  <body>
    <main class="service-shell">
      <a class="back-link" href="./index.html" aria-label="Zurück zur Zeiterfassung">
        <span data-lucide="arrow-left" aria-hidden="true"></span>
        <span>Zeiterfassung</span>
      </a>

      <section class="service-card" aria-labelledby="serviceTitle">
        <span class="service-icon" data-lucide="user-round" aria-hidden="true"></span>
        <p class="section-label">Service</p>
        <h1 id="serviceTitle">Service</h1>
      </section>
    </main>
  </body>
</html>
